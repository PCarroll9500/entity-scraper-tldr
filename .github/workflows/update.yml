name: Update SAM.gov TLDR

on:
  schedule:
    # 12:00 UTC = 7/8am Eastern depending on DST -- adjust as you like
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper + TLDR pipeline
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        # Run from repo root: Python auto-adds src/ (the script's own
        # directory) to sys.path, so `from config import ...` resolves,
        # while relative output paths (docs/, data/) land at repo root.
        run: python src/main.py

      - name: Commit updated page + data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html data/latest_raw.json data/latest_result.json
          git diff --cached --quiet || git commit -m "Update SAM.gov TLDR ($(date -u +%Y-%m-%d))"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
